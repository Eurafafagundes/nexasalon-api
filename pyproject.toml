[project]
name = "nexasalon-api"
version = "0.1.0"
description = "Backend do NexaSalon."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary]>=3.1",
  "uvicorn[standard]>=0.30",
  "argon2-cffi>=23",
  "pyjwt>=2.8",
  "email-validator>=2.0",
  "boto3>=1.34",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pgserver", "pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
