[project]
name = "nexasalon-api"
version = "0.1.0"
description = "Backend do NexaSalon — Etapa 2B: modelos de domínio e migrations."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pgserver"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
