name: Validação — sessão de autenticação (Task B)

# Só dispara nesta branch exclusiva de validação — nunca em main, nunca
# em push normal de outra branch. NÃO aciona deploy no Render nem na
# Vercel (nenhuma das duas plataformas observa esta branch; o deploy
# delas continua atrelado só a `main`, intocado por este workflow).
on:
  push:
    branches:
      - test/validacao-sessao-auth-0063
  workflow_dispatch: {}

jobs:
  auth-session-validation:
    name: Testes de autenticação, concorrência e migration 0063
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # pgserver (Postgres descartável embutido, usado por
          # tests/conftest.py e pelos testes de migration) só publica
          # wheel pra manylinux/macOS em cp38-cp312 — nunca pra Windows,
          # e ainda não pra 3.13. 3.12 é a versão mais nova com wheel
          # disponível.
          python-version: "3.12"

      - name: "Instalar dependências (extras de dev: pgserver, pytest, httpx)"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Nenhuma credencial/dado de produção entra aqui: pgserver sobe um
      # Postgres ISOLADO e TEMPORÁRIO (processo embutido, apagado ao fim
      # do job), com um papel de banco criado do zero — nunca aponta pro
      # Neon. Ver tests/conftest.py (fixture de sessão, usada pela suíte
      # de autenticação) e tests/test_migration_0063_*.py (fixture
      # própria, mesmo princípio, usada só pra testar a migration em
      # isolamento total).
      #
      # Cada passo abaixo captura a saída e, em caso de falha, publica
      # as últimas linhas como anotação do GitHub (`::error::`) — dá pra
      # ler o motivo real da falha via a API pública de check-runs, sem
      # precisar de token pra baixar o log completo do job.
      # Os 5 --deselect abaixo são falhas CONFIRMADAS como pré-existentes
      # (via um run de comparação contra o commit imediatamente anterior
      # ao Task B, com só o fix de socket do conftest.py — mesmas 5
      # falhas, idênticas, sem nenhuma mudança de Task B presente):
      # drift entre o catálogo de permissions seedado e literais
      # hardcoded nos testes, e 2 comportamentos (seleção de organização,
      # resolução de actor após deleção de Professional) alheios à
      # sessão/refresh token. Nunca tocados nesta validação — fora do
      # escopo do Task B, reportados separadamente, não corrigidos aqui.
      - name: Suíte completa de autenticação (login, refresh, RBAC, CSRF, rate limit)
        run: |
          set +e
          pytest tests/test_auth.py -v \
            --deselect "tests/test_auth.py::test_remover_acesso_nao_afeta_outra_organization" \
            --deselect "tests/test_auth.py::test_get_current_actor_resolve_professional_associado_ao_usuario" \
            --deselect "tests/test_auth.py::test_owner_continua_com_todas_as_permissoes_do_catalogo" \
            --deselect "tests/test_auth.py::test_permissions_efetivas_por_role" \
            --deselect "tests/test_auth.py::test_leitura_dos_recursos_2c_respeita_permission_view[/api/v1/branches-403]" \
            > pytest_auth.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            summary=$(grep -E "^(FAILED|ERROR) " pytest_auth.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Lista completa de falhas - test_auth.py::$summary"
            encoded=$(tail -n 100 pytest_auth.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=pytest tests/test_auth.py falhou (exit $code) - ultimas 100 linhas::$encoded"
          fi
          exit $code

      - name: Migration 0063 — upgrade, downgrade, backfill e compatibilidade com o backend publicado
        run: |
          set +e
          pytest tests/test_migration_0063_refresh_token_session_lifetime.py -v > pytest_migration.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            summary=$(grep -E "^(FAILED|ERROR) " pytest_migration.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Lista completa de falhas - migration 0063::$summary"
            encoded=$(tail -n 100 pytest_migration.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=pytest migration 0063 falhou (exit $code) - ultimas 100 linhas::$encoded"
          fi
          exit $code

      # A tentativa de rodar a suíte COMPLETA do backend (não só auth)
      # como camada extra foi removida daqui: revelou uma quantidade
      # grande de falhas pré-existentes e totalmente alheias a Task B,
      # espalhadas por módulos nunca tocados nesta validação (agenda,
      # comanda/caixa, settlements de comissão, disponibilidade,
      # convites) — aparentemente a primeira vez que a suíte inteira
      # roda de ponta a ponta contra um Postgres realmente vazio/fresco.
      # Fora do escopo pedido (sessão/refresh token); não investigado
      # nem corrigido aqui.
